name: CI Pipeline - Spring Boot Tests

# 1. ¿CUÁNDO se despierta el robot? (Los Triggers)
on:
  push:
    branches: [ "main", "develop" ] # Se ejecuta cada vez que subís código a main o develop
  pull_request:
    branches: [ "main" ] # Se ejecuta cuando intentás hacer un Pull Request

# 2. ¿QUÉ va a hacer el robot? (Los Jobs)
jobs:
  testeo-y-verificacion:
    # Levanta una máquina virtual en la nube con la última versión de Ubuntu (Linux)
    runs-on: ubuntu-latest

    # 3. EL PASO A PASO de la receta (Steps)
    steps:

      # Paso A: Descargar tu repositorio de GitHub a esta máquina virtual
      - name: 1️⃣ Checkout del código
        uses: actions/checkout@v4

      # Paso B: Instalar tu versión específica de Java
      - name: 2️⃣ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto' # Usamos la versión de Java de Amazon (muy estándar en la industria)
          cache: maven # Magia negra que hace que la segunda vez que corra el robot, lo haga el doble de rápido

      # Paso C: Darle permiso a Linux para ejecutar Maven
      - name: 3️⃣ Dar permisos de ejecución al Maven Wrapper
        run: chmod +x mvnw

      # Paso D: El momento de la verdad
      - name: 4️⃣ Ejecutar Tests Unitarios
        run: ./mvnw test